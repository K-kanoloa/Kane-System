name: Public source checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public source hashes
        run: sha256sum -c PUBLIC-SOURCE-SHA256SUMS
      - name: Check shared Connector assets and package dependencies
        run: |
          python3 -m unittest discover -s connectors/conformance -p 'test_*.py'
          python3 -m unittest discover -s connectors/kane-mcp -p 'test_*.py'
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Check public documentation links and page identity
        run: python3 scripts/check-public-links.py

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements*.txt
            apps/local-bridge/requirements*.txt
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r apps/api/requirements-dev.txt -r apps/local-bridge/requirements.txt
      - name: API deterministic regression
        working-directory: apps/api
        run: python -m pytest -q tests/test_audit_regressions.py
      - name: Kanaloa ACP lifecycle regression
        working-directory: apps/api
        run: python -m pytest -q tests/test_kanaloa_protocol_lifecycle.py tests/test_kanaloa_runtime.py tests/test_harness_and_adapters.py tests/test_branch_and_recovery.py
      - name: DSH ACP patch safety regression
        run: node scripts/test-patch-dsh-acp.mjs
      - name: Local bridge tests
        working-directory: apps/local-bridge
        run: python -m pytest -q tests

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck:web
      - run: npm run lint
      - run: npm run build:web
