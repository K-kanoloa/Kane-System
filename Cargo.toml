[workspace]
members = ["core", "models", "supervisor"]
resolver = "2"

[workspace.package]
version = "0.3.0-dev"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

