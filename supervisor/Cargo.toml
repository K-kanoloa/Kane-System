[package]
name = "kane-supervisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Local development CLI and process lifecycle experiments for Kane System"

[[bin]]
name = "kanesys"
path = "src/main.rs"

[dependencies]
kane-core = { path = "../core" }
kane-models = { path = "../models" }
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["net", "process", "fs"] }

[dev-dependencies]
tempfile = "3"

